name: temporary-floral-observation-variants

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-site-native-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Generate refined diagrams exclusively through Floral Diagram Generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import html
          import re
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import urlencode

          PAGE = "https://kvetnidiagram.8u.cz/index_en.php"

          common = {
              "aa": "submit form",
              "napodobap": "2",
              "napodobak": "2",
              "napodobac": "3",
              "barvakal": "zel",
              "barvaokv": "cer",
              "barvatyc": "zlu",
              "mezerykal": "1",
              "mezerykor": "1",
              "mezerykor2": "1",
              "mezerylis": "1",
              "mezeryokv": "1",
              "vernacekal": "1",
              "vernacekor": "1",
              "vernacekor2": "1",
              "vernaceokv": "1",
              "nuhelnikokv": "2",
              "posunokv": "0",
              "nuhelnikkal": "3",
              "posunkal": "30",
              "tvarokv": "3",
              "tvarkal": "1",
              "tvarkor": "1",
              "nuhelniktyc": "18+18",
              "posuntyc": "0,10",
              "tvartyc": "1",
              "nektaria": "5/0/100/8/18",
              "styl": "1",
              "osy": "5",
              "posunosy": "0",
              "nuhelnikpes": "5",
              "posunpes": "0",
              "srpes": "0",
              "tvarpes": "2",
              "plosrust": "1",
              "pespoloha": "3",
              "pesvaj": "",
              "tvarvaj": "0",
              "upravytyc": "",
              "upravytycs": "",
              "priblizpro": "",
              "vzorec": "",
          }

          candidates = {
              "F1_petaloids_24_24_24": {
                  "nuhelnikkor": "24+24+24",
                  "posunkor": "0,7.5,0",
              },
              "F2_petaloids_30_30_30": {
                  "nuhelnikkor": "30+30+30",
                  "posunkor": "0,6,0",
              },
              "F3_petaloids_24_24_18": {
                  "nuhelnikkor": "24+24+18",
                  "posunkor": "0,7.5,0",
              },
              "F4_petaloids_30_30_two_whorls": {
                  "nuhelnikkor": "30+30",
                  "posunkor": "0,6",
              },
              "F5_outer_sepals_shape2_petaloids_24": {
                  "tvarokv": "2",
                  "nuhelnikkor": "24+24+24",
                  "posunkor": "0,7.5,0",
              },
          }

          report = []
          successes = 0
          for index, (name, extra) in enumerate(candidates.items(), start=1):
              params = dict(common)
              params.update(extra)
              url = PAGE + "?" + urlencode(params)
              html_path = Path("artifact") / f"{name}.html"
              cmd = [
                  "curl", "-4", "-sS", "-L", "--fail-with-body",
                  "--retry", "6", "--retry-all-errors", "--retry-delay", "4",
                  "--connect-timeout", "35", "--max-time", "240",
                  "-A", "Mozilla/5.0",
                  "-o", str(html_path),
                  url,
              ]
              result = subprocess.run(cmd, text=True, capture_output=True)
              if result.returncode != 0:
                  report.append(f"{name}\n  ERROR curl={result.returncode}: {result.stderr.strip()}\n  query={url}\n")
                  continue

              text = html_path.read_text(encoding="utf-8", errors="replace")
              left = text.find('<div id="vlevo">')
              start = text.find("<svg", left) if left >= 0 else -1
              end = text.find("</svg>", start) if start >= 0 else -1
              if left < 0 or start < 0 or end < 0:
                  report.append(f"{name}\n  ERROR native SVG not found\n  query={url}\n")
                  continue
              native_svg = html.unescape(text[start:end + len("</svg>")])
              if "floral diagram generated" not in native_svg:
                  report.append(f"{name}\n  ERROR wrong SVG extracted\n  query={url}\n")
                  continue

              svg_path = Path("artifact") / f"{name}-site-native.svg"
              svg_path.write_text(native_svg, encoding="utf-8")
              (Path("artifact") / f"{name}-query-url.txt").write_text(url + "\n", encoding="utf-8")
              formula_match = re.search(r'name="vzorec"[^>]*value="([^"]*)"', text)
              formula = html.unescape(formula_match.group(1)) if formula_match else ""
              report.append(
                  f"{name}\n"
                  f"  native_svg_bytes={svg_path.stat().st_size}\n"
                  f"  inferred_formula={formula}\n"
                  f"  query={url}\n"
              )
              successes += 1
              time.sleep(2)

          Path("artifact/refined-candidate-report.txt").write_text("\n".join(report), encoding="utf-8")
          if successes == 0:
              raise RuntimeError("No site-native candidate could be generated after retries")
          PY

      - name: Upload refined site-native exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floral-observation-refined-site-native-candidates
          path: artifact
          if-no-files-found: error
