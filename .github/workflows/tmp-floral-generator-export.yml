name: temporary-floral-generator-export

on:
  push:
    branches:
      - tmp-floral-generator-export-20260819
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-site-output:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate candidate diagrams exclusively through Floral Diagram Generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import html
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urlencode

          BASE = "https://kvetnidiagram.8u.cz/"
          PAGE = BASE + "index_en.php"
          DOWNLOAD = BASE + "ulozit.php"

          common = {
              "aa": "submit form",
              "napodobap": "1",
              "napodobak": "2",
              "napodobac": "3",
              "barvakal": "zel",
              "barvakor": "cer",
              "barvanek": "zlz",
              "barvaokv": "cer",
              "barvatyc": "zlu",
              "mezerykal": "1",
              "mezerykor": "1",
              "mezerykor2": "1",
              "mezerylis": "1",
              "mezeryokv": "1",
              "vernacekal": "1",
              "vernacekor": "1",
              "vernacekor2": "1",
              "vernaceokv": "1",
              "nuhelnikokv": "",
              "posunokv": "",
              "nuhelnikkal": "5",
              "posunkal": "0",
              "srkal": "1",
              "nuhelnikkor": "",
              "posunkor": "",
              "nektaria": "5/0/100/8/18",
              "hypanthium": "",
              "styl": "1",
              "vykreslit": "1",
              "osy": "5",
              "posunosy": "0",
              "nuhelnikpes": "5",
              "posunpes": "0",
              "srpes": "0",
              "tvarpes": "2",
              "plosrust": "1",
              "pespoloha": "3",
              "pesvaj": "5",
              "tvarvaj": "0",
              "tvarkal": "1",
              "tvarkor": "1",
              "tvarokv": "1",
              "tvartyc": "1",
              "upravytycs": "",
              "priblizpro": "",
              "vzorec": "",
          }

          candidates = {
              "A_staminodes_s_fusion": {
                  "nuhelniktyc": "20+20+15+15",
                  "posuntyc": "0,9,0,12",
                  "upravytyc": "1-40s",
                  "addStFus": "1",
                  "addStFusType": "3",
              },
              "B_staminodes_s_no_fusion": {
                  "nuhelniktyc": "20+20+15+15",
                  "posuntyc": "0,9,0,12",
                  "upravytyc": "1-40s",
              },
              "C_staminodes_sb_fusion": {
                  "nuhelniktyc": "20+20+15+15",
                  "posuntyc": "0,9,0,12",
                  "upravytyc": "1-40sb",
                  "addStFus": "1",
                  "addStFusType": "3",
              },
              "D_three_whorls_s_fusion": {
                  "nuhelniktyc": "20+15+15",
                  "posuntyc": "0,12,0",
                  "upravytyc": "1-20s",
                  "addStFus": "1",
                  "addStFusType": "3",
              },
              "E_petaloid_corolla_plus_stamens": {
                  "nuhelnikkor": "20+20",
                  "posunkor": "0,9",
                  "nuhelniktyc": "15+15",
                  "posuntyc": "0,12",
                  "addStFus": "1",
                  "addStFusType": "3",
              },
          }

          report = []
          for name, extra in candidates.items():
              params = dict(common)
              params.update(extra)
              url = PAGE + "?" + urlencode(params)
              html_path = Path("artifact") / f"{name}.html"
              headers_path = Path("artifact") / f"{name}.headers.txt"
              subprocess.run([
                  "curl", "-4", "-sS", "-L", "--fail-with-body",
                  "--connect-timeout", "20", "--max-time", "120",
                  "-A", "Mozilla/5.0",
                  "-D", str(headers_path),
                  "-o", str(html_path),
                  url,
              ], check=True)

              text = html_path.read_text(encoding="utf-8", errors="replace")
              matches = re.findall(r"<svg\b.*?</svg>", text, flags=re.I | re.S)
              site_svgs = [m for m in matches if "floral diagram generated" in m]
              if not site_svgs:
                  site_svgs = [m for m in matches if 'height="600"' in m and 'width="600"' in m]
              if not site_svgs:
                  raise RuntimeError(f"No native floral SVG found for {name}; total SVGs={len(matches)}")
              raw_svg = html.unescape(max(site_svgs, key=len))
              raw_path = Path("artifact") / f"{name}-inline-site.svg"
              raw_path.write_text(raw_svg, encoding="utf-8")

              download_path = Path("artifact") / f"{name}-download-site.svg"
              subprocess.run([
                  "curl", "-4", "-sS", "-L", "--fail-with-body",
                  "--connect-timeout", "20", "--max-time", "120",
                  "-A", "Mozilla/5.0",
                  "--data-urlencode", f"jsvalue@{raw_path}",
                  "-o", str(download_path),
                  DOWNLOAD,
              ], check=True)

              # Keep the exact query used for reproducibility.
              (Path("artifact") / f"{name}-query-url.txt").write_text(url + "\n", encoding="utf-8")
              formula_text = " ".join(re.findall(r"<text\b[^>]*>(.*?)</text>", raw_svg, flags=re.I | re.S))
              formula_text = re.sub(r"<[^>]+>", "", formula_text)
              formula_text = html.unescape(re.sub(r"\s+", " ", formula_text)).strip()
              report.append(
                  f"{name}\n  url={url}\n  html={html_path.stat().st_size}\n"
                  f"  inline_svg={raw_path.stat().st_size}\n  downloaded_svg={download_path.stat().st_size}\n"
                  f"  extracted_text={formula_text[:1000]}\n"
              )

          Path("artifact/candidate-report.txt").write_text("\n".join(report), encoding="utf-8")
          PY

      - name: Upload native candidate exports
        uses: actions/upload-artifact@v4
        with:
          name: floral-generator-native-candidates
          path: artifact
          if-no-files-found: error
