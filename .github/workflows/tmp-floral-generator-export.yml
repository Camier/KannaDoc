name: temporary-floral-generator-export

on:
  push:
    branches:
      - tmp-floral-generator-export-20260819
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-site-output:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate final variants exclusively through Floral Diagram Generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import html
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urlencode

          PAGE = "https://kvetnidiagram.8u.cz/index_en.php"

          common = {
              "aa": "submit form",
              "napodobap": "1",
              "napodobak": "2",
              "napodobac": "3",
              "barvakal": "zel",
              "barvakor": "cer",
              "barvanek": "zlz",
              "barvaokv": "cer",
              "barvatyc": "zlu",
              "mezerykal": "1",
              "mezerykor": "1",
              "mezerykor2": "1",
              "mezerylis": "1",
              "mezeryokv": "1",
              "vernacekal": "1",
              "vernacekor": "1",
              "vernacekor2": "1",
              "vernaceokv": "1",
              "nuhelnikokv": "",
              "posunokv": "",
              "nuhelnikkal": "5",
              "posunkal": "0",
              "nuhelnikkor": "",
              "posunkor": "",
              "nuhelniktyc": "20+20+15+15",
              "posuntyc": "0,9,0,12",
              "upravytyc": "1-40s",
              "upravytycs": "",
              "nektaria": "5/0/100/8/18",
              "hypanthium": "",
              "styl": "1",
              "osy": "5",
              "posunosy": "0",
              "nuhelnikpes": "5",
              "posunpes": "0",
              "srpes": "0",
              "tvarpes": "2",
              "plosrust": "1",
              "pespoloha": "3",
              "pesvaj": "5",
              "tvarvaj": "0",
              "tvarkal": "1",
              "tvarkor": "1",
              "tvarokv": "1",
              "tvartyc": "1",
              "priblizpro": "",
              "vzorec": "",
          }

          variants = {
              "F1_fused_sepals": {"srkal": "1"},
              "F2_free_sepals": {},
              "F3_fused_sepals_hypanthium": {"srkal": "1", "hypanthium": "120/108/12"},
          }

          report = []
          for name, extra in variants.items():
              params = dict(common)
              params.update(extra)
              url = PAGE + "?" + urlencode(params)
              page_path = Path("artifact") / f"{name}.html"
              subprocess.run([
                  "curl", "-4", "-sS", "-L", "--fail-with-body",
                  "--connect-timeout", "20", "--max-time", "120",
                  "-A", "Mozilla/5.0",
                  "-o", str(page_path),
                  url,
              ], check=True)

              text = page_path.read_text(encoding="utf-8", errors="replace")
              patterns = [
                  r'(<svg\b[^>]*height="600"[^>]*width="600"[^>]*>.*?</svg>)',
                  r'(<svg\b[^>]*width="600"[^>]*height="600"[^>]*>.*?</svg>)',
              ]
              matches = []
              for pattern in patterns:
                  matches.extend(re.findall(pattern, text, flags=re.I | re.S))
              matches = [m for m in matches if "floral diagram generated" in m]
              if not matches:
                  raise RuntimeError(f"No native floral SVG found for {name}")
              native_svg = html.unescape(max(matches, key=len))
              svg_path = Path("artifact") / f"{name}-site-native.svg"
              svg_path.write_text(native_svg, encoding="utf-8")
              (Path("artifact") / f"{name}-query-url.txt").write_text(url + "\n", encoding="utf-8")

              visible_text = " ".join(re.findall(r"<text\b[^>]*>(.*?)</text>", native_svg, flags=re.I | re.S))
              visible_text = re.sub(r"<[^>]+>", "", visible_text)
              visible_text = html.unescape(re.sub(r"\s+", " ", visible_text)).strip()
              report.append(
                  f"{name}\n  query={url}\n  native_svg_bytes={svg_path.stat().st_size}\n"
                  f"  visible_text={visible_text[:800]}\n"
              )

          Path("artifact/final-variant-report.txt").write_text("\n".join(report), encoding="utf-8")
          PY

      - name: Upload final site-native variants
        uses: actions/upload-artifact@v4
        with:
          name: floral-generator-final-native-variants
          path: artifact
          if-no-files-found: error
