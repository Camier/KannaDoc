name: temporary-floral-generator-export

on:
  push:
    branches:
      - tmp-floral-generator-export-20260819

permissions:
  contents: read

jobs:
  fetch-site-output:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch a native generated page and inspect export links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import html
          import re
          import urllib.request
          from pathlib import Path

          url = (
              "https://kvetnidiagram.8u.cz/index_en.php?"
              "aa=vyhodnotit+formul%C3%A1%C5%99&barvakal=zel&barvakor=cer&barvanek=zlz&"
              "barvaokv=cer&barvatyc=zlu&mezerykal=1&mezerykor=1&mezerykor2=1&"
              "mezerylis=1&mezeryokv=1&nektaria=5%2F0%2F100%2F15%2F20&"
              "nuhelnikkal=&nuhelnikkor=&nuhelnikokv=&nuhelnikpes=&nuhelniktyc=&"
              "osy=&pespoloha=1&pesvaj=&plosrust=1&posunkal=&posunkor=&posunokv=&"
              "posunosy=&posunpes=&posuntyc=&priblizpro=&srpes=0&styl=1&tvarkal=1&"
              "tvarkor=1&tvarokv=1&tvarpes=2&tvartyc=1&tvarvaj=0&upravytyc=&"
              "upravytycs=&vernacekal=1&vernacekor=1&vernacekor2=1&vernaceokv=1&vzorec="
          )
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=45) as response:
              body = response.read()
              status = response.status
              final_url = response.geturl()
              headers = dict(response.headers.items())

          Path("artifact/page.html").write_bytes(body)
          text = body.decode("utf-8", errors="replace")

          hrefs = re.findall(r'href=["\']([^"\']+)', text, flags=re.I)
          srcs = re.findall(r'src=["\']([^"\']+)', text, flags=re.I)
          forms = re.findall(r'<form\b[^>]*>', text, flags=re.I)
          inputs = re.findall(r'<input\b[^>]*>', text, flags=re.I)
          svgs = re.findall(r'<svg\b.*?</svg>', text, flags=re.I | re.S)

          report = [
              f"status={status}",
              f"final_url={final_url}",
              f"content_length={len(body)}",
              "headers=" + repr(headers),
              "\nFORMS:\n" + "\n".join(forms),
              "\nINPUTS:\n" + "\n".join(inputs),
              "\nHREFS:\n" + "\n".join(hrefs),
              "\nSRCS:\n" + "\n".join(srcs),
              f"\nINLINE_SVG_COUNT={len(svgs)}",
          ]
          Path("artifact/report.txt").write_text("\n".join(report), encoding="utf-8")
          if svgs:
              Path("artifact/inline.svg").write_text(html.unescape(svgs[0]), encoding="utf-8")
          print("\n".join(report[:4]))
          PY

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: floral-generator-inspection
          path: artifact
          if-no-files-found: error
