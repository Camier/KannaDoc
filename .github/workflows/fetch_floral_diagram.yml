name: Fetch native floral diagram

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_URL: >-
    https://kvetnidiagram.8u.cz/index_en.php?aa=submit+form&barvakal=zel&barvakor=cer&barvanek=zlz&barvaokv=cer&barvatyc=zlu&mezerykal=1&mezerykor=1&mezerykor2=1&mezerylis=1&mezeryokv=1&nektaria=5%2F0%2F100%2F15%2F20&nuhelnikkal=5&nuhelnikkor=&nuhelnikokv=&nuhelnikpes=5&nuhelniktyc=15%2B15%2B15&osy=5&pespoloha=3&pesvaj=&plosrust=1&posunkal=0&posunkor=&posunokv=&posunosy=0&posunpes=0&posuntyc=0%2C12%2C0&priblizpro=&srkal=1&srpes=0&addStFus=1&addStFusType=3&styl=1&tvarkal=1&tvarkor=1&tvarokv=1&tvarpes=2&tvartyc=1&tvarvaj=0&upravytyc=1-15sb%2C16-30s&upravytycs=16-45&vernacekal=1&vernacekor=1&vernacekor2=1&vernaceokv=1&vzorec=K5+A15%2B15%2B15+-G%285%29

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch generator output and native SVG
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          out = Path('floral-generator-output')
          out.mkdir(exist_ok=True)
          target = os.environ['TARGET_URL'].strip()
          session = requests.Session()
          session.headers['User-Agent'] = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'

          debug = {'target_url': target}
          for label, url in [('base', 'https://kvetnidiagram.8u.cz/index_en.php'), ('target', target)]:
              r = session.get(url, timeout=60, allow_redirects=True)
              debug[label] = {
                  'status': r.status_code,
                  'final_url': r.url,
                  'content_type': r.headers.get('content-type'),
                  'length': len(r.content),
              }
              (out / f'{label}.html').write_bytes(r.content)
              r.raise_for_status()
              text = r.text
              if label == 'target':
                  m = re.search(r'(<svg\b.*?</svg>)', text, flags=re.I | re.S)
                  if m:
                      (out / 'diagram-native.svg').write_text(m.group(1), encoding='utf-8')
                      debug['svg_source'] = 'inline'
                  else:
                      hrefs = re.findall(r'href=["\']([^"\']+)["\']', text, flags=re.I)
                      debug['hrefs'] = hrefs
                      candidates = [h for h in hrefs if '.svg' in h.lower() or 'download' in h.lower()]
                      for h in candidates:
                          svg_url = urljoin(r.url, h)
                          sr = session.get(svg_url, timeout=60, allow_redirects=True)
                          if sr.ok and (b'<svg' in sr.content[:10000] or 'svg' in (sr.headers.get('content-type') or '').lower()):
                              (out / 'diagram-native.svg').write_bytes(sr.content)
                              debug['svg_source'] = svg_url
                              debug['svg_status'] = sr.status_code
                              break

          target_html = (out / 'target.html').read_text(encoding='utf-8', errors='replace')
          inputs = []
          for tag in re.findall(r'<input\b[^>]*>', target_html, flags=re.I):
              name_m = re.search(r'name=["\']?([^"\'\s>]+)', tag, flags=re.I)
              if not name_m:
                  continue
              value_m = re.search(r'value=["\']?([^"\'>\s]*)', tag, flags=re.I)
              inputs.append({
                  'name': name_m.group(1),
                  'value': value_m.group(1) if value_m else '',
                  'checked': bool(re.search(r'\bchecked\b', tag, flags=re.I)),
                  'tag': tag,
              })
          debug['inputs'] = inputs
          (out / 'debug.json').write_text(json.dumps(debug, ensure_ascii=False, indent=2), encoding='utf-8')

          svg = out / 'diagram-native.svg'
          if not svg.exists():
              raise SystemExit('Native SVG not found in generator response or download links')
          print(f'Native SVG saved: {svg} ({svg.stat().st_size} bytes)')
          PY

      - name: Upload native generator output
        uses: actions/upload-artifact@v4
        with:
          name: floral-diagram-native
          path: floral-generator-output/
          if-no-files-found: error
          retention-days: 3
